[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These modules deal in real-world typography on purpose: minus signs, en dashes, curly quotes
# and the sentence terminators of non-Latin scripts.
"app/extraction/pdf/*.py" = ["RUF001"]
"app/extraction/tables.py" = ["RUF001"]
"app/extraction/readers/*.py" = ["RUF001"]
"app/chunking/sentences.py" = ["RUF001"]
"app/chunking/qa.py" = ["RUF001"]
"tests/test_pdf_extraction.py" = ["RUF001"]
"tests/test_sentences.py" = ["RUF001"]
"tests/test_readers.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One marker per decision in docs/safety-considerations.md, so CI can report the evidence for
# each one (scripts/safety_report.py). A test may carry more than one.
markers = [
    "safety_output: 1. images and links are removed from what reaches a client",
    "safety_prompt: 2. the prompt's structure cannot be forged",
    "safety_limits: 3. what a single file can cost is bounded",
    "safety_deletion: 4. one bad run cannot wipe the corpus",
    "safety_attacks: 5. the attack set, against a model that obeys everything",
    "safety_untrusted: 6. document-derived fields are declared untrusted",
]
strict_markers = true

[[tool.mypy.overrides]]
# pdfplumber has no stubs; pytesseract is an optional dependency that may not be installed.
module = ["pdfplumber", "pdfplumber.*", "pytesseract"]
ignore_missing_imports = true
