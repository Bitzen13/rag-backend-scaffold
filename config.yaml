extraction:
  provider: filesystem
  path: data/documents          # put your documents here
  # Which files are picked up. A reader is chosen per extension (extraction/readers/registry.py):
  # .pdf, .md, .html, .docx, .csv/.tsv, .xlsx, .json/.yaml, .eml/.mbox, source code, and plain
  # text as the fallback for anything else.
  extensions: [.md, .txt, .pdf]
  # Corpus-specific cleanup for text extracted from PDFs. These are regular expressions and do not
  # affect how structure (headings, tables, columns) is detected, which is worked out per file.
  pdf:
    strip_patterns: []           # removed wherever they appear, e.g. '\[\d+\]' for [12]
    truncate_patterns: []        # text from the first match onward is dropped
    skip_sections: []            # sections left out entirely, by heading text, e.g. References
    borderless_tables: true      # also detect tables aligned with whitespace, not ruling lines
    ocr:                         # read pages that are an image of text (needs Tesseract)
      enabled: false
      language: eng
      min_characters: 20         # a page with fewer characters than this looks scanned
      resolution: 300
  # What one file may cost, and what one run may delete. A file over a limit is rejected with a
  # named reason and the run carries on (docs/safety-considerations.md).
  limits:
    max_file_bytes: 104857600                 # 100 MiB on disk
    max_archive_uncompressed_bytes: 524288000 # DOCX/XLSX: what the archive declares it unpacks to
    max_spreadsheet_cells: 2000000            # per sheet, from its declared dimensions
    max_extracted_chars: 20000000
    max_chunks_per_document: 20000
    max_metadata_bytes: 65536                 # a document's metadata, serialised as JSON
    # A run that would delete more than this share of the stored sources stops before doing
    # anything (an empty mount would otherwise delete everything). One run can override it
    # with `scripts/ingest.py --allow-mass-delete`.
    max_delete_fraction: 0.5

chunking:
  # Sizes are in tokens of the embedding model below, counted with its own tokenizer.
  chunk_size: 500
  chunk_overlap: 50
  # Hard cap per chunk. Left unset on purpose: it is derived from the embedding model's own
  # input limit. Set it only for a model whose limit chunking/tokenizer.py does not know, in
  # which case config loading fails with that message rather than guessing.
  # max_chunk_tokens: 8000
  tokenizer: auto                # auto (the embedding model's tokenizer) | words
  prose_splitting: sentence      # paragraph | sentence - where document_aware cuts long prose
  # Pick a strategy for EACH document (key = path relative to extraction.path). A document that
  # is not listed here is not ingested. Strategies: fixed_size | document_aware.
  # A document may instead be given a mapping to override chunk_size, chunk_overlap or
  # prose_splitting for that file alone:
  #   report.pdf:
  #     strategy: document_aware
  #     chunk_size: 400
  #     prose_splitting: paragraph
  documents: {}
  # List each file you add to data/documents, for example:
  # documents:
  #   handbook.md: document_aware
  #   price-list.pdf: document_aware

retrieval:
  top_k: 5
  similarity_threshold: 0.4
  excerpt_max_chars: 300
  # Typo-tolerant keyword search, merged with the vector search (fuzzy_top_k: 0 turns it off).
  fuzzy_top_k: 5
  fuzzy_min_similarity: 0.6            # 1.0 = word appears verbatim; lower tolerates more typos
  fuzzy_max_matches_per_phrase: 50     # a phrase matching more chunks than this is too common
  fuzzy_min_relative_evidence: 0.5     # drop fuzzy hits weaker than this fraction of the best one

models:
  embedding_provider: openai
  embedding_model: text-embedding-3-small
  llm_provider: anthropic
  # Check the current model ids before starting a project: https://docs.claude.com/en/docs/about-claude/models
  llm_model: claude-sonnet-5
  llm_max_tokens: 1024
  # How long a provider call may take, and how many times it may be retried before the request
  # is answered 503. Retries are the provider SDK's own, and are bounded.
  llm_timeout_seconds: 60
  llm_max_retries: 3
  embedding_timeout_seconds: 30
  embedding_max_retries: 3

vector_db:
  provider: pgvector

auth:
  api_key_header: X-API-Key

api:
  # Rejected with 400 before the question reaches the embedding or LLM call.
  max_question_chars: 2000
  # Store each answered question in query_logs. api_keys.last_used_at is recorded either way.
  log_queries: true
  # Per-key limiting, counted in Postgres so several workers share one allowance.
  rate_limit:
    requests: 60                 # per window, per key; 0 turns limiting off
    window_seconds: 60
  cors:
    # Only for a browser calling this API directly, which would mean shipping it an API key.
    # Consumer frontends call from their own server, where CORS does not apply. Empty = off.
    allowed_origins: []

database:
  # A statement that runs longer than this is cancelled, so a hung query surfaces as a 503
  # instead of holding a worker open. Covers the vector search and the keyword search too:
  # both are Postgres.
  statement_timeout_seconds: 30
  connect_timeout_seconds: 10

logging:
  level: INFO
  format: text                   # text | json - json is one object per line, for a log shipper

safety:
  output:
    # Links in answers, excerpts and source names are removed unless their host is listed here
    # (exact host names, http/https only). Images are always removed: rendering one fetches its
    # URL with no click, which is how an injected instruction would leak data. Empty = no links.
    allowed_link_hosts: []
