# Retrieval evaluation set: a question, and a passage that answers it.
#
# A case passes when one of its `expect` passages appears in a retrieved chunk (whitespace and
# case are ignored). Passages are named by their text rather than by chunk id, so the set stays
# valid when chunking changes - which is exactly when it is needed.
#
# Run it with: python scripts/evaluate.py
# Record it as the baseline with: python scripts/evaluate.py --save-baseline \
#     evaluation/baselines/retrieval.json
#
# ---------------------------------------------------------------------------------------------
# REPLACE THIS FILE. These cases are written against the two-document sample corpus in
# data/sample, which produces four chunks in total - fewer than `retrieval.top_k`. They prove
# the harness runs end to end; they cannot tell you whether retrieval is any good, because with
# four chunks every search returns the whole corpus and recall@5 is 1.0 by construction.
#
# For a real corpus, write 20-30 questions about your own documents, ideally from whoever asked
# for the system, and cover the kinds of question that matter: an exact name, a number in a
# table, a definition, something only stated in passing, a misspelling, and a question your
# documents do not answer at all. Then record the baseline, and every later change to chunking
# or retrieval is measured against it rather than argued about.
# ---------------------------------------------------------------------------------------------

cases:
  - question: What is Retrieval-Augmented Generation?
    expect: ["grounds a large language model's answers in external source material"]
    source_uri: rag-overview.md
    note: a definition, stated in the opening paragraph

  - question: Why does RAG reduce made-up answers?
    expect: ["the model is instructed to stay within the retrieved context"]
    source_uri: rag-overview.md

  - question: Do I have to retrain the model when the documents change?
    expect: ["updating the underlying documents updates the answers, with no model retraining"]
    source_uri: rag-overview.md
    note: the answer is phrased as a benefit, not as the question asks it

  - question: What are the two phases of a RAG system?
    expect: ["Ingestion prepares the knowledge base", "Querying happens at request time"]
    source_uri: rag-overview.md
    note: either passage counts; both are in the same section

  - question: What happens to a question at request time?
    expect: ["The question is embedded, the most similar chunks are retrieved"]
    source_uri: rag-overview.md

  - question: Which pipeline stage has to change for a new data source?
    expect: ["the only\nstage that needs to change when the system is pointed at a new data source"]
    source_uri: pipeline-stages.txt

  - question: What is chunk overlap for?
    expect: ["Overlap keeps ideas\nthat straddle a boundary intact"]
    source_uri: pipeline-stages.txt

  - question: Where are the vectors stored by default?
    expect: ["The default implementation uses pgvector inside Postgres"]
    source_uri: pipeline-stages.txt

  - question: How does retrieval handle a misspelled name?
    expect: ["typo-tolerant keyword search"]
    source_uri: pipeline-stages.txt
    note: what the fuzzy search exists for; retrieval.fuzzy_top_k turns it off

  - question: Is retrieved text trusted by the prompt?
    expect: ["Retrieved text is treated as untrusted data"]
    source_uri: pipeline-stages.txt
